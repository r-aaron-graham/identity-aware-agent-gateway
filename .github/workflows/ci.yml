name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iaag:ci .
      - run: docker run -d --name iaag -p 8000:8000 -e IAAG_SECRET_KEY=ci-secret iaag:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' iaag)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs iaag; exit 1
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/health
          token=$(curl -fsS http://127.0.0.1:8000/api/v1/auth/demo-tokens | python -c "import sys,json; print(json.load(sys.stdin)['analyst']['token'])")
          out=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/agent/query \
            -H "Authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"prompt":"Summarize the oncall incident runbook","requested_tool":"search_docs","sensitivity":"medium"}')
          echo "$out"
          echo "$out" | grep -q '"outcome":"approved"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/reviews -H "Authorization: Bearer $token")" = "403"
      - run: test "$(docker exec iaag id -u)" = "10001"
      - if: failure()
        run: docker logs iaag
