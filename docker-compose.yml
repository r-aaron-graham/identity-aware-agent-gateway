services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      IAAG_DB_PATH: /app/data/iaag.db
      # Replace before exposing this anywhere but localhost.
      IAAG_SECRET_KEY: ${IAAG_SECRET_KEY:-change-me}
      IAAG_AUTO_INIT_DB: "true"
      IAAG_ENABLE_DEMO_TOKENS: ${IAAG_ENABLE_DEMO_TOKENS:-true}
    volumes:
      - iaag-data:/app/data

volumes:
  iaag-data:
